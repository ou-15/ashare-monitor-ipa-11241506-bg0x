<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e20">
<title>接口自检</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;background:#0a0e20;color:#e9ecff;
  font:13px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  padding:calc(16px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}
h1{font-size:17px;margin:0 0 6px}
.env{color:#9aa6d0;font-size:12px;margin:0 0 12px;word-break:break-all}
pre{white-space:pre-wrap;word-break:break-all;background:rgb(255 255 255 / 7%);
  border:1px solid rgb(255 255 255 / 12%);border-radius:12px;padding:12px;margin:0;font-size:12px}
.bar{display:flex;gap:8px;margin:12px 0}
button{flex:1;padding:10px;border-radius:10px;border:1px solid rgb(255 255 255 / 18%);
  background:rgb(255 255 255 / 10%);color:#e9ecff;font-size:13px}
.tip{color:#8f9bc4;font-size:12px;margin-top:10px}
</style>
</head>
<body>
<h1>接口自检</h1>
<p class="env" id="env">准备中…</p>
<pre id="out">开始…</pre>
<div class="bar">
  <button id="again">重新检测</button>
  <button id="copy">复制结果</button>
</div>
<p class="tip">把这个结果截图/复制发我，就能定位是哪一层取不到数。</p>
<script src="diag.js"></script>
<script src="tabbar.js"></script>
</body>
</html>
