name: build-android-apk

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'web/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Stage web assets into APK
        run: |
          set -e
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          rsync -a --exclude '_*' web/ android/app/src/main/assets/www/
          echo "staged files: $(ls android/app/src/main/assets/www | wc -l)"
          ls android/app/src/main/assets/www

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Inspect APK
        run: |
          set -e
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          ls -l "$APK"
          echo "--- entries of interest ---"
          unzip -l "$APK" | grep -E "assets/www/(fund|index|us|news|diag).html|classes.dex" || true
          unzip -l "$APK" | tail -3

      - uses: actions/upload-artifact@v4
        with:
          name: AshareBoard-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
